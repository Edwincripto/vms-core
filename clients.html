<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VMS | Центр управления штатом и клиентами</title>
    <style>
        :root {
            --bg-dark: #0a0c10; --panel-bg: #14171d; --card-bg: #1e222a;
            --text-main: #f3f4f6; --text-muted: #9ca3af;
            --accent: #2563eb; --danger: #dc2626; --warning: #f59e0b; --success: #10b981;
            --border: #2a2f3a; --radius: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Inter, sans-serif; }
        body { background: var(--bg-dark); color: var(--text-main); padding: 24px; }

        .container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
        .header h1 { font-size: 20px; }
        .btn-nav { background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border); padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 13px; }
        .btn-nav:hover { background: var(--border); }

        /* Вкладки */
        .tabs { display: flex; gap: 8px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
        .tab-button { background: var(--card-bg); color: var(--text-muted); border: 1px solid var(--border); padding: 10px 20px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .tab-button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .grid { display: grid; grid-template-columns: 360px 1fr; gap: 24px; }

        .panel { background: var(--panel-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
        .panel h2 { font-size: 16px; margin-bottom: 16px; color: #fff; }

        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
        .form-group label { font-size: 12px; color: var(--text-muted); }
        .form-control { background: var(--bg-dark); border: 1px solid var(--border); color: #fff; padding: 10px 12px; border-radius: 6px; font-size: 13px; outline: none; }
        .form-control:focus { border-color: var(--accent); }

        .btn-save { background: var(--accent); color: #fff; border: none; padding: 12px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; width: 100%; }
        .btn-save:hover { background: #1d4ed8; }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
        th { color: var(--text-muted); font-size: 11px; text-transform: uppercase; }

        .btn-action-sm { padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; border: none; font-weight: 600; margin-right: 4px; }
        .btn-edit { background: var(--card-bg); color: #fff; border: 1px solid var(--border); }
        .btn-edit:hover { background: var(--border); }
        .btn-block { background: rgba(245, 158, 11, 0.2); color: var(--warning); border: 1px solid var(--warning); }
        .btn-unblock { background: rgba(16, 185, 129, 0.2); color: var(--success); border: 1px solid var(--success); }
        .btn-del { background: rgba(220, 38, 38, 0.2); color: var(--danger); border: 1px solid var(--danger); }
        .btn-test { background: rgba(245, 158, 11, 0.2); border: 1px solid var(--warning); color: var(--warning); }

        .badge-active { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .badge-blocked { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; background: rgba(220, 38, 38, 0.2); color: var(--danger); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h1>Центр управления системой VMS</h1>
            <p style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">Администрирование операторов смены и внешних клиентов</p>
        </div>
        <a href="dashboard.html" class="btn-nav">← На Дашборд</a>
    </div>

    <!-- ВКЛАДКИ -->
    <div class="tabs">
        <button class="tab-button active" onclick="switchSection('operators')">👥 Операторы смены (Штат)</button>
        <button class="tab-button" onclick="switchSection('clients')">🏢 Клиенты & Telegram-рассылка</button>
    </div>

    <!-- СЕКЦИЯ 1: ОПЕРАТОРЫ -->
    <div id="section-operators" class="tab-content active">
        <div class="grid">
            <div class="panel">
                <h2 id="op-form-title">Добавить оператора</h2>
                <input type="hidden" id="op-id">
                <div class="form-group">
                    <label>Логин в системе (уникальный)</label>
                    <input type="text" id="op-username" class="form-control" placeholder="op_elvin">
                </div>
                <div class="form-group">
                    <label>ФИО сотрудника</label>
                    <input type="text" id="op-name" class="form-control" placeholder="Эльвин Мамедов">
                </div>
                <div class="form-group">
                    <label>Отдел / Смена</label>
                    <input type="text" id="op-dept" class="form-control" placeholder="Охрана / Пост 1">
                </div>
                <div class="form-group">
                    <label>Роль в системе</label>
                    <select id="op-role" class="form-control">
                        <option value="Operator">Operator (Оператор мониторинга)</option>
                        <option value="Supervisor">Supervisor (Старший смены)</option>
                    </select>
                </div>
                <button class="btn-save" onclick="saveOperator()">💾 Сохранить оператора</button>
                <button id="btn-cancel-edit" style="display:none; width:100%; margin-top:8px; background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:12px;" onclick="resetOpForm()">Отменить редактирование</button>
            </div>

            <div class="panel">
                <h2>Штат операторов мониторинга</h2>
                <table>
                    <thead>
                        <tr>
                            <th>ФИО</th>
                            <th>Логин</th>
                            <th>Отдел</th>
                            <th>Статус</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="operators-tbody">
                        <!-- Заполняется JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- СЕКЦИЯ 2: КЛИЕНТЫ -->
    <div id="section-clients" class="tab-content">
        <div class="grid">
            <div class="panel">
                <h2>Добавить клиента</h2>
                <div class="form-group">
                    <label>Объект / Компания</label>
                    <input type="text" id="client-company" class="form-control" placeholder="Склад Маркетплейса">
                </div>
                <div class="form-group">
                    <label>Контактное лицо</label>
                    <input type="text" id="client-contact" class="form-control" placeholder="Ильхам Мамедов">
                </div>
                <div class="form-group">
                    <label>Telegram Chat ID</label>
                    <input type="text" id="client-chat-id" class="form-control" placeholder="386048422">
                </div>
                <div class="form-group">
                    <label>Привязанная камера</label>
                    <select id="client-camera" class="form-control">
                        <option value="dahua_cam1">dahua_cam1 (Основной въезд / КПП)</option>
                        <option value="cam2">cam2 (Парковка / Склад)</option>
                    </select>
                </div>
                <button class="btn-save" onclick="saveClient()">💾 Сохранить и связать с ботом</button>
            </div>

            <div class="panel">
                <h2>Клиенты с привязкой Telegram</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Компания</th>
                            <th>Контакт</th>
                            <th>Камера</th>
                            <th>Telegram ID</th>
                            <th>Тест тревоги</th>
                        </tr>
                    </thead>
                    <tbody id="clients-tbody">
                        <!-- Заполняется JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    function switchSection(tab) {
        document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        if (tab === 'operators') {
            document.querySelectorAll('.tab-button')[0].classList.add('active');
            document.getElementById('section-operators').classList.add('active');
            loadOperators();
        } else {
            document.querySelectorAll('.tab-button')[1].classList.add('active');
            document.getElementById('section-clients').classList.add('active');
            loadClients();
        }
    }

    // ========== ОПЕРАТОРЫ ==========
    let operatorsCache = [];

    async function loadOperators() {
        try {
            const res = await fetch('/api/admin/operators');
            operatorsCache = await res.json();
            const tbody = document.getElementById('operators-tbody');
            tbody.innerHTML = '';

            operatorsCache.forEach(op => {
                const tr = document.createElement('tr');
                const isBlocked = op.status === 'blocked';
                tr.innerHTML = `
                    <td><b>${op.name}</b></td>
                    <td><code>${op.username}</code></td>
                    <td>${op.department || '—'}</td>
                    <td>
                        <span class="${isBlocked ? 'badge-blocked' : 'badge-active'}">
                            ${isBlocked ? 'Заблокирован' : 'Активен'}
                        </span>
                    </td>
                    <td>
                        <button class="btn-action-sm btn-edit" onclick="editOperator(${op.id})">✏️</button>
                        <button class="btn-action-sm ${isBlocked ? 'btn-unblock' : 'btn-block'}" onclick="toggleStatus(${op.id}, '${isBlocked ? 'active' : 'blocked'}')">
                            ${isBlocked ? 'Разблок' : 'Блок'}
                        </button>
                        <button class="btn-action-sm btn-del" onclick="deleteOperator(${op.id})">🗑️</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (e) {
            console.error("Ошибка загрузки операторов");
        }
    }

    async function saveOperator() {
        const id = document.getElementById('op-id').value;
        const username = document.getElementById('op-username').value.trim();
        const name = document.getElementById('op-name').value.trim();
        const dept = document.getElementById('op-dept').value.trim();
        const role = document.getElementById('op-role').value;

        if (!username || !name) return alert("Логин и ФИО обязательны!");

        const res = await fetch('/api/save_operator', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ id: id || null, username: username, name: name, department: dept, role: role })
        });
        const data = await res.json();
        alert(data.message);
        resetOpForm();
        loadOperators();
    }

    function editOperator(id) {
        const op = operatorsCache.find(o => o.id === id);
        if (!op) return;
        document.getElementById('op-id').value = op.id;
        document.getElementById('op-username').value = op.username;
        document.getElementById('op-name').value = op.name;
        document.getElementById('op-dept').value = op.department;
        document.getElementById('op-role').value = op.role;
        document.getElementById('op-form-title').innerText = "Редактировать оператора";
        document.getElementById('btn-cancel-edit').style.display = "block";
    }

    function resetOpForm() {
        document.getElementById('op-id').value = '';
        document.getElementById('op-username').value = '';
        document.getElementById('op-name').value = '';
        document.getElementById('op-dept').value = '';
        document.getElementById('op-form-title').innerText = "Добавить оператора";
        document.getElementById('btn-cancel-edit').style.display = "none";
    }

    async function toggleStatus(id, newStatus) {
        await fetch('/api/toggle_operator_status', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ id: id, status: newStatus })
        });
        loadOperators();
    }

    async function deleteOperator(id) {
        if (!confirm("Удалить оператора из системы?")) return;
        await fetch('/api/delete_operator', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ id: id })
        });
        loadOperators();
    }

    // ========== КЛИЕНТЫ ==========
    async function loadClients() {
        try {
            const res = await fetch('/api/clients');
            const list = await res.json();
            const tbody = document.getElementById('clients-tbody');
            tbody.innerHTML = '';
            
            list.forEach(c => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><b>${c.company_name}</b></td>
                    <td>${c.contact_person}</td>
                    <td><code>${c.assigned_camera}</code></td>
                    <td>${c.telegram_chat_id}</td>
                    <td>
                        <button class="btn-action-sm btn-test" onclick="testAlert('${c.assigned_camera}')">🚨 Тест</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (e) {
            console.error("Ошибка загрузки клиентов");
        }
    }

    async function saveClient() {
        const company = document.getElementById('client-company').value.trim();
        const contact = document.getElementById('client-contact').value.trim();
        const chatId = document.getElementById('client-chat-id').value.trim();
        const camera = document.getElementById('client-camera').value;

        if (!company || !contact || !chatId) return alert("Заполните все поля!");

        const res = await fetch('/api/save_client', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ company_name: company, contact_person: contact, telegram_chat_id: chatId, assigned_camera: camera })
        });

        const data = await res.json();
        alert(data.message);
        loadClients();
        document.getElementById('client-company').value = '';
        document.getElementById('client-contact').value = '';
        document.getElementById('client-chat-id').value = '';
    }

    async function testAlert(camera) {
        const res = await fetch('/api/trigger_camera_alert', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ camera: camera, type: 'Тестовая тревога (Ручной пуск)' })
        });
        const data = await res.json();
        alert(`Сигнал отправлен! Получателей: ${data.sent_to}`);
    }

    window.addEventListener('DOMContentLoaded', () => {
        loadOperators();
    });
</script>

</body>
</html>
